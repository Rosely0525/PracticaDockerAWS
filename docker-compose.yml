version: '3.8'

services:
  backend:
    build: ./backend
    container_name: contenedor_backend
    ports:
      - "5000:3000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME} # El nombre exacto de tu bucket S3
      # - AWS_SESSION_TOKEN=tu_token       # Descomenta solo si usas token temporal
    networks:
      - red-s3

  frontend:
    build: ./frontend
    container_name: contenedor_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - red-s3

networks:
  red-s3:
    driver: bridge