server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location /upload {
        proxy_pass http://backend:3000/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /files {
        proxy_pass http://backend:3000/files;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}