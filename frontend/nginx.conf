server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /login {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location /download/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /upload {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location /files {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}